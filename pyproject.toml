[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "master-operations-agent"
dynamic = ["version"]
description = "Evidence-first, synthetic-lab operations advisory workbench"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
moa = "moa.cli:main"

[tool.setuptools.package-data]
moa = ["web/*.html", "web/*.css", "web/*.js", "data/*.json"]

[tool.setuptools.dynamic]
version = {attr = "moa.__version__"}

[tool.setuptools.packages.find]
include = ["moa*"]
