[project]
name = "master-operations-agent"
version = "0.4.0"
description = "Evidence-first, synthetic-lab operations advisory workbench"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
moa = "moa.cli:main"

[tool.setuptools.package-data]
