name: Research checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: python -m moa eval > smoke-report.json
      - run: node --test tests/stream-boundary.test.cjs tests/export-quality.test.cjs
      - run: for f in scripts/*.cjs scripts/lib/*.cjs moa/web/app.js; do node --check "$f"; done
